[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vrideauxx"
version = "0.1.0"
description = "vrideauxx project documentation and assignments"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mkdocs",
    "mkdocs-material",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "project",
    "."
]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
